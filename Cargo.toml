[package]
name = "sftp-s3"
version = "0.1.0"
edition = "2021"
description = "Pluggable SFTP server with S3 and custom backend support"
license = "Apache-2.0"
repository = "https://github.com/elixir-ssh/sftp-s3-rs"

[features]
default = ["s3"]
s3 = ["aws-sdk-s3", "aws-config"]

[dependencies]
# SSH/SFTP
russh = { git = "https://github.com/EpicEric/russh.git", branch = "cryptovec-performance", default-features = false, features = ["aws-lc-rs", "flate2"] }
russh-sftp = { git = "https://github.com/mjc/russh-sftp.git", branch = "deserialize-bytes-optimization" }

# Async runtime
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "fs", "sync", "macros"] }
async-trait = "0.1"
futures = "0.3"

# S3 (optional)
aws-sdk-s3 = { version = "1", optional = true }
aws-config = { version = "1", features = ["behavior-version-latest"], optional = true }

# Compression (zlib-rs for speed - pure Rust, fastest backend)
flate2 = { version = "1", features = ["zlib-rs"], default-features = false }

# Utilities
bytes = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
parking_lot = "0.12"
clap = { version = "4", features = ["derive", "env"] }

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3"
proptest = "1.4"
criterion = { version = "0.8", features = ["async_tokio"] }
iai-callgrind = "0.16"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
debug = false
strip = true

# Profile for profiling with flamegraph (optimized but with debug symbols)
[profile.profiling]
inherits = "release"
debug = 1
strip = false
split-debuginfo = "off"
lto = false

# Profile for benchmarks (need symbols for iai-callgrind)
[profile.bench]
strip = false
debug = 1

[[bench]]
name = "transfer"
harness = false

[[bench]]
name = "protocol"
harness = false

[[bench]]
name = "protocol_iai"
harness = false
